<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f4">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Quiz Studio</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/formats.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/samples.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <header class="app-header">
    <a href="#library" class="brand"><span class="brand-mark" aria-hidden="true">Q</span>Quiz Studio<span class="version">0.1</span></a>
    <div class="header-right"><span id="save-state" role="status"></span><button data-action="settings" class="quiet">設定</button></div>
  </header>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="save-error" class="notice error" role="alert" hidden></div>
  <main id="main" tabindex="-1"><p>読み込み中…</p></main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input type="file" id="import-files" accept=".json,.csv" multiple hidden>
  <input type="file" id="import-folder" webkitdirectory multiple hidden>
  <noscript>JavaScriptを有効にしてください。問題データはブラウザ内で処理します。</noscript>
</body>
</html>
